<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos plataformas (Sucursal: 226)</title>
    <style>
        :root {
            --bg-main: #f0f0e8;
            --bg-panel: #fcfcf4;
            --border-color: #9c9c9c;
            --blue-selected: #0066cc;
            --orange-solic: #ff8000;
            --auto: #6e59ee;
            --auto-soft: #efeaff;
            --auto-border: #d6ccff;
        }

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            font-size: 12px;
        }

        body {
            background-color: #7da2ce;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Contenedor Principal (Ventana) */
        .window {
            background-color: var(--bg-main);
            border: 3px solid #6b9cde;
            border-radius: 4px;
            width: 1000px;
            max-width: 100%;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }

        /* Barra de título estilo Windows */
        .window-header {
            background: linear-gradient(to bottom, #0058e6, #3a93ff);
            color: white;
            padding: 5px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }

        .window-controls button {
            background: #e04343;
            color: white;
            border: 1px solid #fff;
            padding: 1px 6px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Cuerpo de la aplicación */
        .app-container {
            display: grid;
            grid-template-columns: 60% 40%;
            gap: 8px;
            padding: 8px;
        }

        /* Pestañas Superiores Left */
        .tabs {
            display: flex;
            background-color: var(--bg-main);
            border-bottom: 1px solid var(--border-color);
        }

        .tab {
            padding: 6px 30px;
            border: 1px solid var(--border-color);
            border-bottom: none;
            background-color: var(--bg-panel);
            cursor: pointer;
            text-align: center;
        }

        .tab.active {
            background-color: var(--bg-panel);
            font-weight: bold;
            position: relative;
            bottom: -1px;
            z-index: 2;
        }

        .tab.inactive {
            background-color: #e4e4dc;
            color: #666;
        }

        /* TABLA DE PEDIDOS */
        .left-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .table-container {
            background-color: white;
            border: 1px solid var(--border-color);
            height: 350px;
            overflow-y: scroll;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: var(--bg-main);
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 4px;
            font-weight: normal;
        }

        td {
            padding: 6px 4px;
            border-right: 1px solid #e0e0e0;
            border-bottom: 1px solid #e0e0e0;
            vertical-align: middle;
        }

        tbody tr { cursor: pointer; }
        tbody tr:hover { background-color: #f7f9fc; }

        .row-selected {
            outline: 2px solid var(--blue-selected);
            background-color: #f2f7ff;
        }

        /* Estados internos de la tabla */
        .badge-grido {
            color: #d3141e;
            font-weight: bold;
            font-style: italic;
            font-size: 14px;
        }
        .badge-grido span { color: #004b93; }

        /* Badge de plataforma para pedidos I+D (SmartPedidos). Es el logo/label
           normal de la plataforma en la columna Servicio — sin distinción visual. */
        .badge-id {
            display: inline-block;
            color: var(--auto);
            font-weight: bold;
            font-style: italic;
            font-size: 14px;
            letter-spacing: .5px;
        }

        /* Badge "AUTO-ENTREGA" en la columna H. Entrega — identifica los pedidos
           con autoBillingDelivered = true. Es la MARCA VISUAL principal de la fila. */
        .badge-auto-entrega {
            display: inline-block;
            background: var(--auto);
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 8px;
            letter-spacing: .4px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        /* fila I+D con un sutil tinte violeta para diferenciarlas a primera vista */
        tr.row-auto td:first-child {
            border-left: 3px solid var(--auto);
        }
        tr.row-auto.row-selected {
            outline: 2px solid var(--auto);
            background-color: #f5f2ff;
        }

        .status-solic {
            background-color: var(--orange-solic);
            color: white;
            text-align: center;
            font-weight: bold;
            padding: 2px;
            border-radius: 2px;
            display: block;
        }

        .status-facturado {
            background-color: #2f9e44;
            color: white;
            text-align: center;
            font-weight: bold;
            padding: 2px;
            border-radius: 2px;
            display: block;
        }

        .status-rechazado {
            background-color: #c0392b;
            color: white;
            text-align: center;
            font-weight: bold;
            padding: 2px;
            border-radius: 2px;
            display: block;
        }

        /* Resumen de Estados (Botones de abajo a la izquierda) */
        .status-summary {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            margin-top: 8px;
        }

        .btn-status {
            border: 1px solid var(--border-color);
            padding: 6px;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
        }
        .solicitado { background-color: #ff8000; color: white; }
        .preparacion { background-color: #dcd82c; color: black; }
        .listo { background-color: #00cc66; color: white; }
        .camino { background-color: #3399ff; color: white; }
        .observada { background-color: #808080; color: white; }

        /* Logos Plataformas Inferiores */
        .platform-logos {
            display: flex;
            gap: 5px;
            margin-top: 8px;
            align-items: center;
        }
        .logo-placeholder {
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            background: white;
            font-weight: bold;
            font-size: 10px;
            border-radius: 4px;
            text-align: center;
            min-width: 45px;
        }

        /* PANEL DERECHO (DETALLE DEL PEDIDO) */
        .right-panel {
            border: 1px solid var(--border-color);
            background-color: var(--bg-panel);
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .right-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
            margin-bottom: 5px;
        }

        .update-box {
            background-color: white;
            border: 1px solid var(--border-color);
            padding: 2px 10px;
            text-align: center;
        }
        .update-box strong { font-size: 14px; }

        /* Aviso de pedido I+D (auto-entrega) en el panel derecho */
        .auto-banner {
            background: var(--auto-soft);
            border: 1px solid var(--auto-border);
            color: #5040d0;
            padding: 6px 8px;
            margin-bottom: 6px;
            border-radius: 3px;
            font-size: 11px;
            line-height: 1.35;
        }
        .auto-banner b { color: var(--auto); }

        /* Contenido del Ticket o Comanda */
        .ticket-detail {
            background-color: white;
            border: 1px solid var(--border-color);
            padding: 8px;
            height: 320px;
            overflow-y: auto;
            font-family: monospace;
            white-space: pre-wrap;
            line-height: 1.4;
        }

        .ticket-empty {
            color: #999;
            font-family: Arial, sans-serif;
            font-style: italic;
            text-align: center;
            padding-top: 130px;
        }

        /* Acciones del lado derecho */
        .right-actions {
            margin-top: 8px;
        }
        .action-row-1 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 5px;
            margin-bottom: 5px;
        }
        .action-row-1.auto {
            grid-template-columns: 1fr 1fr;
        }
        .action-row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }

        .btn-action {
            padding: 8px;
            border: 1px solid var(--border-color);
            background-color: #e0e0d8;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
            border-radius: 3px;
        }
        .btn-action:active { background-color: #ccc; }
        .btn-action:disabled {
            opacity: .55;
            cursor: not-allowed;
        }
        .btn-danger {
            border: 2px solid var(--blue-selected);
            color: #cc0000;
            background-color: #f0f0f0;
        }

        /* Botón FACTURAR (verde, solo para pedidos I+D) */
        .btn-facturar {
            border: 2px solid #1f7a32;
            color: #fff;
            background-color: #2f9e44;
        }
        .btn-facturar:hover { background-color: #28893b; }

        /* Botón RECHAZAR I+D (rojo destacado) */
        .btn-rechazar-auto {
            border: 2px solid #8a1f1f;
            color: #fff;
            background-color: #c0392b;
        }
        .btn-rechazar-auto:hover { background-color: #a8311f; }

        .circle-icon {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #999;
            vertical-align: middle;
            margin-right: 3px;
        }

        /* Toast simple para feedback */
        .toast {
            position: fixed;
            bottom: 18px;
            right: 18px;
            background: #333;
            color: #fff;
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.3);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity .2s, transform .2s;
            z-index: 999;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.success { background: #2f9e44; }
        .toast.danger { background: #c0392b; }
        .toast.auto { background: var(--auto); }

        /* ══════════════════════════════════════════════════════════════════
           OVERLAY GENÉRICO (para diálogos modales de SKU y Cobro en efectivo)
           Ambos comparten el mismo backdrop; se distinguen por el contenido.
           ══════════════════════════════════════════════════════════════════ */
        .win-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .win-overlay.show { display: flex; }

        .win-dialog {
            background-color: var(--bg-main);
            border: 3px solid #6b9cde;
            border-radius: 4px;
            box-shadow: 4px 4px 16px rgba(0, 0, 0, .4);
            display: flex;
            flex-direction: column;
        }

        .win-dialog-header {
            background: linear-gradient(to bottom, #0058e6, #3a93ff);
            color: white;
            padding: 5px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }

        .win-dialog-header .win-title {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .win-dialog-header .win-title::before {
            content: '';
            display: inline-block;
            width: 14px;
            height: 14px;
            background: radial-gradient(circle at 30% 30%, #a0d8ff 0%, #3a93ff 60%, #0058e6 100%);
            border-radius: 50%;
        }

        .win-dialog-controls {
            display: flex;
            gap: 3px;
        }

        .win-dialog-controls button {
            background: #d4d4d4;
            color: #000;
            border: 1px solid #6b9cde;
            padding: 0 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
            min-width: 20px;
        }

        .win-dialog-controls button.close {
            background: #e04343;
            color: white;
        }

        /* ══════════════════════════════════════════════════════════════════
           DIÁLOGO "ASOCIAR ARTÍCULOS" (SKU desconocido)
           Réplica del diálogo del POS on-premise. Se abre al presionar Facturar
           sobre un pedido I+D con ítems que no matchean la lista de precios.
           ══════════════════════════════════════════════════════════════════ */
        .sku-dialog { width: 900px; max-width: 96vw; }

        .sku-topbar {
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 18px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-main);
        }

        .sku-topbar .label { font-weight: bold; }

        .sku-check {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 6px;
        }

        .sku-check-box {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 1px solid #666;
            background: #fff;
            vertical-align: middle;
        }

        .sku-check.active .sku-check-box {
            background: var(--orange-solic);
            border-color: var(--orange-solic);
        }

        .sku-indef-btn {
            margin-left: auto;
            padding: 4px 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-panel);
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
        }

        .sku-table-wrap {
            padding: 6px 10px;
            background: var(--bg-main);
        }

        .sku-main-table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border: 1px solid var(--border-color);
        }

        .sku-main-table th {
            background: var(--bg-main);
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 4px;
            font-weight: bold;
            text-align: left;
        }

        .sku-main-table td {
            padding: 6px 4px;
            border-right: 1px solid #e0e0e0;
            border-bottom: 1px solid #e0e0e0;
            vertical-align: middle;
        }

        .sku-main-table tr.sku-row-selected td {
            background: #dcebff;
        }

        .sku-main-table tr.sku-row-selected td:first-child {
            border-left: 3px solid var(--blue-selected);
        }

        .sku-main-table tr.sku-row-promo td {
            background: #ffe6cc;
        }

        .sku-verified {
            width: 14px;
            height: 14px;
            border: 1px solid #666;
            background: #fff;
            display: inline-block;
            text-align: center;
            line-height: 12px;
            font-size: 10px;
            font-weight: bold;
        }

        .sku-verified.checked { background: #cfe9d1; }

        .sku-form {
            padding: 8px 10px;
            background: var(--bg-main);
            display: grid;
            grid-template-columns: 70px 1fr;
            gap: 4px 8px;
            align-items: center;
        }

        .sku-form label { font-weight: bold; }
        .sku-form input {
            width: 100%;
            padding: 3px 6px;
            border: 1px solid var(--border-color);
            background: #fff;
            font-family: Arial, sans-serif;
            font-size: 12px;
        }

        .sku-search-bar {
            background: #b3f0f0;
            padding: 5px 6px;
            border: 1px solid var(--border-color);
            margin: 0 10px 8px 10px;
        }

        .sku-search-bar input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-family: Arial, sans-serif;
            font-size: 12px;
        }

        .sku-results-wrap {
            padding: 0 10px 6px 10px;
            background: var(--bg-main);
        }

        .sku-results {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border: 1px solid var(--border-color);
            min-height: 100px;
        }

        .sku-results th,
        .sku-results td {
            padding: 5px 6px;
            border-right: 1px solid #e0e0e0;
            border-bottom: 1px solid #e0e0e0;
            text-align: left;
        }

        .sku-results th {
            background: var(--bg-main);
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
        }

        .sku-results tr.sku-result-row:hover td { background: #f7f9fc; }
        .sku-results tr.sku-result-row.selected td { background: #dcebff; }

        .sku-footer-hint {
            padding: 4px 10px;
            font-size: 11px;
            color: #333;
            background: var(--bg-main);
        }

        .sku-actions {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 10px 10px 10px;
            background: var(--bg-main);
            border-top: 1px solid var(--border-color);
        }

        .sku-actions .spacer { flex: 1; }

        .win-btn {
            padding: 8px 18px;
            border: 1px solid var(--border-color);
            background: linear-gradient(to bottom, #f5f5ee 0%, #d8d8cf 100%);
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            min-width: 100px;
            justify-content: center;
        }

        .win-btn:hover { background: linear-gradient(to bottom, #fdfdf5 0%, #e3e3d8 100%); }
        .win-btn:disabled { opacity: .5; cursor: not-allowed; }

        .win-btn .icon-round {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #666;
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
        }

        .win-btn.win-btn-exit .icon-round { background: #c0392b; }

        /* ══════════════════════════════════════════════════════════════════
           DIÁLOGO "VUELTO" (Cobro en efectivo)
           Réplica del DialogPay del POS on-premise. Formulario a la izquierda
           con importe/paga con/vuelto + teclado numérico a la derecha.
           ══════════════════════════════════════════════════════════════════ */
        .cash-dialog { width: 620px; max-width: 96vw; }

        .cash-topheader {
            background: #333;
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            padding: 8px 12px;
            text-align: center;
        }

        .cash-body {
            display: grid;
            grid-template-columns: 1fr 260px;
            gap: 10px;
            padding: 12px;
            background: var(--bg-main);
        }

        .cash-form {
            display: grid;
            grid-template-columns: 90px 1fr;
            gap: 6px 8px;
            align-items: center;
        }

        .cash-form label {
            font-weight: bold;
            color: #000;
        }

        .cash-form .field {
            display: block;
            padding: 4px 6px;
            border: 1px solid var(--border-color);
            background: #fff;
            font-family: Arial, sans-serif;
            font-size: 12px;
            text-align: right;
            min-height: 22px;
        }

        .cash-form .field.select {
            background: linear-gradient(to right, #fff 0%, #fff 92%, #d4d4d4 92%);
            background-repeat: no-repeat;
            font-weight: bold;
            text-align: left;
            padding-right: 20px;
        }

        .cash-form .field.select.efectivo {
            background: linear-gradient(to right, var(--blue-selected) 0%, var(--blue-selected) 92%, #d4d4d4 92%);
            color: #fff;
        }

        .cash-form .field.negative { color: #c0392b; }

        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            align-content: start;
        }

        .numpad-key {
            padding: 12px 0;
            border: 1px solid var(--border-color);
            background: linear-gradient(to bottom, #f5f5ee 0%, #d8d8cf 100%);
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
        }

        .numpad-key:hover { background: linear-gradient(to bottom, #fdfdf5 0%, #e3e3d8 100%); }
        .numpad-key.back { color: #c0392b; font-size: 14px; }
        .numpad-key.check {
            grid-column: 1 / -1;
            background: linear-gradient(to bottom, #eefaf1 0%, #cfe9d1 100%);
            color: #2f9e44;
            font-size: 14px;
        }

        .cash-actions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            padding: 8px 12px 12px 12px;
            background: var(--bg-main);
            border-top: 1px solid var(--border-color);
        }

        .cash-boleta-btn {
            padding: 10px 6px;
            border: 1px solid var(--border-color);
            background: linear-gradient(to bottom, #f5f5ee 0%, #d8d8cf 100%);
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
            text-align: center;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            line-height: 1.15;
        }

        .cash-boleta-btn:hover:not(:disabled) { background: linear-gradient(to bottom, #fdfdf5 0%, #e3e3d8 100%); }
        .cash-boleta-btn:disabled { opacity: .5; cursor: not-allowed; }
        .cash-boleta-btn.highlight { border: 2px solid #2f9e44; background: linear-gradient(to bottom, #eefaf1 0%, #cfe9d1 100%); }

        .cash-boleta-btn .icon {
            font-size: 18px;
        }

        .cash-boleta-btn.cancel {
            color: #c0392b;
        }

        .cash-boleta-btn.cancel .icon {
            color: #c0392b;
        }
    </style>
</head>
<body>

<div class="window">
    <div class="window-header">
        <span>Pedidos plataformas (Sucursal: 226)</span>
        <div class="window-controls">
            <button>X</button>
        </div>
    </div>

    <div class="app-container">

        <div class="left-panel">
            <div>
                <div class="tabs">
                    <div class="tab active">Pedidos</div>
                    <div class="tab inactive">Historial</div>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 18%;">Servicio</th>
                                <th style="width: 12%;">Estado</th>
                                <th style="width: 27%;">Cliente</th>
                                <th style="width: 25%;"># Pedido</th>
                                <th style="width: 10%;">H. Entrega</th>

<script>
    /* ════════════════════════════════════════════════════════════════════════════════
       MOCKUP POS ON-PREMISE — Funcionalidad AUTODELIVERED (I+D / SmartPedidos)
       ────────────────────────────────────────────────────────────────────────────────
       Adapta el POS on-premise para que conviva el flujo NORMAL (Grido, etc.) con la
       nueva modalidad AUTODELIVERED de I+D. Mismo principio que el mockup cloud:

       • Pedidos NORMALES (autoDelivered:false): botones "Confirmar / Confirmar entrega
         / Rechazar" (igual que hoy).
       • Pedidos I+D (autoDelivered:true): botones "FACTURAR / RECHAZAR" (1 paso).
         FACTURAR equivale al "Confirmar" pero finaliza inmediatamente; RECHAZAR cierra
         el pedido. Ambos llevan el pedido a un estado final.

       Las filas I+D se distinguen con:
         · borde violeta a la izquierda de la fila
         · badge "I+D" + chip "AUTO" violeta en la columna Servicio
         · banner explicativo arriba del ticket cuando se selecciona

       Al click en una fila, el ticket-detail se actualiza con los datos del pedido
       (manteniendo el formato monoespaciado tipo comanda) y se re-renderizan los
       botones de acción correspondientes.
       ════════════════════════════════════════════════════════════════════════════════ */

    // ── DATA ──

    let selectedOrderId = null;

    // ── INIT ──
    function init() {
        renderRows();
        updateCounts();
    }

    function renderRows() {
        const tbody = document.getElementById('orders-tbody');
        tbody.innerHTML = orders.map(o => {
            const rowClass = (o.autoDelivered ? 'row-auto' : '')
                + (selectedOrderId === o.id ? ' row-selected' : '');
            // La columna Servicio muestra el badge de la plataforma que corresponda.
            // Para pedidos I+D es el label "I+D" plano, sin marca de auto-entrega.
            const servicioHtml = o.autoDelivered
                ? `<span class="badge-id">I+D</span>`
                : `<span class="badge-grido">gri<span>do</span></span>`;
            let estadoHtml;
            if (o.estadoFinal === 'FACTURADO') estadoHtml = `<span class="status-facturado">FACT</span>`;
            else if (o.estadoFinal === 'RECHAZADO') estadoHtml = `<span class="status-rechazado">RECH</span>`;
            else estadoHtml = `<span class="status-solic">SOLIC</span>`;
            // La MARCA visual de auto-entrega vive en la columna H. Entrega: badge violeta
            // "AUTO-ENTREGA" cuando el pedido tiene autoBillingDelivered = true.
            const hEntregaHtml = o.autoDelivered
                ? `<span class="badge-auto-entrega">Auto-Entrega</span>`
                : '';
            return `
                <tr class="${rowClass}" onclick="selectOrder('${o.id}')">
                    <td>${servicioHtml}</td>
                    <td>${estadoHtml}</td>
                    <td>${o.cliente}</td>
                    <td>${o.pedidoNro}</td>
                    <td>${hEntregaHtml}</td>
                    <td style="text-align: center;">:</td>
                </tr>
            `;
        }).join('');
    }

    function updateCounts() {
        const solic = orders.filter(o => !o.estadoFinal).length;
        document.getElementById('cnt-solic').textContent = solic;
    }

    function selectOrder(id) {
        if (selectedOrderId === id) {
            // toggle off
            selectedOrderId = null;
            renderRows();
            showEmptyTicket();
            renderActions(null);
            return;
        }
        selectedOrderId = id;
        renderRows();
        const order = orders.find(o => o.id === id);
        renderTicket(order);
        renderActions(order);
    }

    function showEmptyTicket() {
        document.getElementById('auto-banner-container').innerHTML = '';
        document.getElementById('ticket-detail').innerHTML =
            `<div class="ticket-empty">Seleccioná un pedido de la lista para ver su detalle.</div>`;
    }

    // Formato tipo comanda (monoespaciado) — alineación a 42 columnas (igual al original)
    function pad(label, value, width = 42) {
        const s = label + value;
        if (s.length >= width) return s;
        return label + ' '.repeat(width - s.length) + value;
    }

    function renderTicket(order) {
        // Items
        const itemsHtml = order.items.map(i => {
            const qtyAndName = (i.qty + (i.name ? ' ' + i.name : '')).trim();
            const linea = pad(qtyAndName, '$' + i.precio.toLocaleString('es-AR'));
            const detalle = i.detalle ? `\n  ${i.detalle}` : '';
            return linea + detalle;
        }).join('\n\n');

        const plataforma = order.autoDelivered ? 'SmartPedidos (I+D)' : 'PediGrido';

        const ticket =
`PLATAFORMA                    ${plataforma}
NOMBRE REPARTIDOR              ${order.repartidor}
FECHA                     ${order.fecha}
ENTREGA
TIPO ENTREGA             ${order.tipoEntrega}
IDENTIFICADOR PEDIDO PLATAFORMA
  ${order.pedidoNro}
CLIENTE
  ${order.cliente}
IDENTIFICACION DE CLIENTE
  ${order.clienteId}
TELEFONO
  ${order.telefono}
DIRECCION
  ${order.direccion}
NOTA DEL PEDIDO
  ${order.nota}
------------------------------------------
ITEM                                PRECIO

${itemsHtml}
------------------------------------------
${pad('Sub-Total:', '$' + order.subtotal.toLocaleString('es-AR'))}`;

        document.getElementById('ticket-detail').textContent = ticket;
    }

    function renderActions(order) {
        const cont = document.getElementById('right-actions');
        if (!order) {
            cont.innerHTML = `
                <div class="action-row-1">
                    <button class="btn-action" disabled><span class="circle-icon"></span>Confirmar</button>
                    <button class="btn-action" disabled><span class="circle-icon"></span>Confirmar entrega</button>
                    <button class="btn-action btn-danger" disabled>❌ Rechazar</button>
                </div>
                <div class="action-row-2">
                    <button class="btn-action" disabled><span class="circle-icon"></span>Asociar artículo</button>
                    <button class="btn-action" disabled>🖨️ Reimprimir comanda</button>
                </div>
            `;
            return;
        }

        // Pedido ya resuelto (facturado o rechazado): bloquear acciones
        if (order.estadoFinal) {
            const label = order.estadoFinal === 'FACTURADO'
                ? '✅ Pedido facturado — finalizado'
                : '❌ Pedido rechazado — finalizado';
            const color = order.estadoFinal === 'FACTURADO' ? '#2f9e44' : '#c0392b';
            cont.innerHTML = `
                <div style="padding:10px; text-align:center; font-weight:bold; color:${color}; border:1px solid ${color}; background:#fff; border-radius:3px; margin-bottom:5px;">
                    ${label}
                </div>
                <div class="action-row-2">
                    <button class="btn-action" disabled><span class="circle-icon"></span>Asociar artículo</button>
                    <button class="btn-action">🖨️ Reimprimir comanda</button>
                </div>
            `;
            return;
        }

        // Pedido I+D (auto-entrega): mismo formato que el flujo normal, solo cambia "Confirmar" por "Facturar"
        if (order.autoDelivered) {
            cont.innerHTML = `
                <div class="action-row-1">
                    <button class="btn-action" onclick="facturarPedido('${order.id}')"><span class="circle-icon"></span>Facturar</button>
                    <button class="btn-action" style="color:#888;" disabled><span class="circle-icon"></span>Confirmar entrega</button>
                    <button class="btn-action btn-danger" onclick="rechazarPedido('${order.id}')">❌ Rechazar</button>
                </div>
                <div class="action-row-2">
                    <button class="btn-action" style="color:#888;" disabled><span class="circle-icon"></span>Asociar artículo</button>
                    <button class="btn-action">🖨️ Reimprimir comanda</button>
                </div>
            `;
            return;
        }

        // Pedido normal (Grido): flujo de 3 pasos
        //   1) initial   → Confirmar / Confirmar entrega (off) / Rechazar  |  Asociar artículo (off) / Reimprimir
        //   2) confirmed → Listo para Entrega / Confirmar entrega (off) / Rechazar  |  Asociar artículo (off) / Reimprimir
        //   3) ready     → Enviar (off) / Confirmar entrega (off) / Rechazar  |  ⭐ Realizar venta / Reimprimir
        const step = order.flowStep || 'initial';

        let primaryBtn;
        if (step === 'initial') {
            primaryBtn = `<button class="btn-action" onclick="confirmarPedido('${order.id}')"><span class="circle-icon"></span>Confirmar</button>`;
        } else if (step === 'confirmed') {
            primaryBtn = `<button class="btn-action" onclick="listoParaEntrega('${order.id}')"><span class="circle-icon"></span>Listo para Entrega</button>`;
        } else { // 'ready'
            primaryBtn = `<button class="btn-action" style="color:#888;" disabled><span class="circle-icon"></span>Enviar</button>`;
        }

        const secondaryBtn = (step === 'ready')
            ? `<button class="btn-action" onclick="realizarVenta('${order.id}')">⭐ Realizar venta</button>`
            : `<button class="btn-action" style="color:#888;" disabled><span class="circle-icon"></span>Asociar artículo</button>`;

        cont.innerHTML = `
            <div class="action-row-1">
                ${primaryBtn}
                <button class="btn-action" style="color:#888;" disabled><span class="circle-icon"></span>Confirmar entrega</button>
                <button class="btn-action btn-danger" onclick="rechazarPedido('${order.id}')">❌ Rechazar</button>
            </div>
            <div class="action-row-2">
                ${secondaryBtn}
                <button class="btn-action">🖨️ Reimprimir comanda</button>
            </div>
        `;
    }

    // ── ACCIONES ──
    // facturarPedido encadena:
    //   1) Si hay SKU desconocido → abre "Asociar artículos".
    //   2) Si el pago es en efectivo → abre "Vuelto" (DialogPay).
    //   3) Recién ahí finaliza (FACTURADO).
    function facturarPedido(id) {
        const o = orders.find(x => x.id === id);
        if (!o || o.estadoFinal) return;

        if (o.autoDelivered && o.unknownSku) {
            openSkuDialog(o);
            return;
        }
        if (o.autoDelivered && o.paymentMethod === 'Efectivo') {
            openCashDialog(o);
            return;
        }
        proceedFacturarPedido(o);
    }

    // Finalización real de la facturación (usada por facturarPedido y por los diálogos).
    function proceedFacturarPedido(o) {
        if (!o || o.estadoFinal) return;
        o.estadoFinal = 'FACTURADO';
        renderRows();
        renderActions(o);
        updateCounts();
        showToast(o.autoDelivered ? 'Pedido I+D facturado → finalizado' : 'Pedido facturado', o.autoDelivered ? 'auto' : 'success');
    }

    function confirmarPedido(id) {
        const o = orders.find(x => x.id === id);
        if (!o || o.estadoFinal) return;
        o.flowStep = 'confirmed';
        renderActions(o);
        showToast('Pedido confirmado', 'success');
    }

    function listoParaEntrega(id) {
        const o = orders.find(x => x.id === id);
        if (!o || o.estadoFinal) return;
        o.flowStep = 'ready';
        renderActions(o);
        showToast('Pedido listo para entrega', 'success');
    }

    function realizarVenta(id) {
        const o = orders.find(x => x.id === id);
        if (!o || o.estadoFinal) return;
        o.estadoFinal = 'FACTURADO';
        renderRows();
        renderActions(o);
        updateCounts();
        showToast('Venta realizada — pedido finalizado', 'success');
    }

    function rechazarPedido(id) {
        const o = orders.find(x => x.id === id);
        if (!o || o.estadoFinal) return;
        o.estadoFinal = 'RECHAZADO';
        renderRows();
        renderActions(o);
        updateCounts();
        showToast(o.autoDelivered ? 'Pedido I+D rechazado → finalizado' : 'Pedido rechazado', 'danger');
    }

    function showToast(msg, type = '') {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'toast show' + (type ? ' ' + type : '');
        clearTimeout(t._timer);
        t._timer = setTimeout(() => { t.className = 'toast'; }, 2500);
    }

    // ══════════════════════════════════════════════════════════════════
    //  DIÁLOGO "ASOCIAR ARTÍCULOS" (SKU desconocido)
    //  Replica el diálogo del POS on-premise:
    //    - Fila del ítem sin mapear (resaltada en azul).
    //    - Filas "Sabores Helado 1/4 Kg" (Cabecera promo) ya verificadas.
    //    - Formulario Artículo/Opcion/Nota abajo, cyan search bar, resultados.
    //    - Footer con Teclado / Asociar / Confirmar / Salir.
    //  Reglas del mockup:
    //    - Salir       → cierra sin cambios (equivale a CANCELAR).
    //    - Asociar     → si el operador tipeó algo en la búsqueda, marca la fila
    //                    como verificada. Habilita Confirmar.
    //    - Confirmar   → cierra y continúa la facturación (si es efectivo,
    //                    abre "Vuelto"; sino, finaliza).
    // ══════════════════════════════════════════════════════════════════
    let skuDialogOrderId = null;
    let skuState = { searchText: '', associated: false };

    function openSkuDialog(order) {
        skuDialogOrderId = order.id;
        skuState = { searchText: '', associated: false };
        renderSkuDialog(order);
        document.getElementById('sku-overlay').classList.add('show');
    }

    function closeSkuDialog() {
        document.getElementById('sku-overlay').classList.remove('show');
        skuDialogOrderId = null;
    }

    function renderSkuDialog(order) {
        const dlg = document.getElementById('sku-dialog');
        const target = order.items.find(i => i.undefined) || order.items[0];
        const rowsHtml = `
            <tr class="sku-row-selected">
                <td><strong>${target.name || target.qty}</strong></td>
                <td></td>
                <td></td>
                <td>${skuState.associated ? '1/4 KILO' : ''}</td>
                <td style="text-align:center;"><span class="sku-verified ${skuState.associated ? 'checked' : ''}">${skuState.associated ? '✓' : ''}</span></td>
            </tr>
            <tr class="sku-row-promo">
                <td>Sabores Helado 1/4 Kg</td>
                <td>Chocolate, Limón</td>
                <td></td>
                <td>1/4 KILO</td>
                <td style="text-align:center;"><span class="sku-verified checked">✓</span></td>
            </tr>
            <tr class="sku-row-promo">
                <td>Sabores Helado 1/4 Kg</td>
                <td>Menta Granizada, Sambayón</td>
                <td></td>
                <td>1/4 KILO</td>
                <td style="text-align:center;"><span class="sku-verified checked">✓</span></td>
            </tr>
        `;

        const canAssociate = skuState.searchText.trim().length > 0 && !skuState.associated;
        const canConfirm = skuState.associated;

        dlg.innerHTML = `
            <div class="win-dialog-header">
                <div class="win-title">Asociar artículos</div>
                <div class="win-dialog-controls">
                    <button>–</button>
                    <button>▢</button>
                    <button class="close" onclick="skuCancel()">✕</button>
                </div>
            </div>

            <div class="sku-topbar">
                <span class="label">Artículos no encontrados:</span>
                <span class="sku-check"><span class="sku-check-box"></span>Articulo individual</span>
                <span class="sku-check active"><span class="sku-check-box"></span>Cabecera promo</span>
                <span class="sku-check"><span class="sku-check-box"></span>Detalle promo</span>
                <button class="sku-indef-btn" onclick="skuAssociateIndef()">Asociar articulo indefinido</button>
            </div>

            <div class="sku-table-wrap">
                <table class="sku-main-table">
                    <thead>
                        <tr>
                            <th style="width:26%;">Artículos del pedido</th>
                            <th style="width:24%;">Opcion</th>
                            <th style="width:20%;">Nota</th>
                            <th style="width:20%;">Artículo asociado</th>
                            <th style="width:10%; text-align:center;">Verificado</th>
                        </tr>
                    </thead>
                    <tbody>${rowsHtml}</tbody>
                </table>
            </div>

            <div class="sku-form">
                <label>Articulo</label><input type="text" value="${target.name || target.qty}" readonly />
                <label>Opcion</label><input type="text" value="" readonly />
                <label>Nota</label><input type="text" value="" readonly />
            </div>

            <div class="sku-search-bar">
                <input type="text" id="sku-search" placeholder="Buscar artículo..." value="${skuState.searchText}" oninput="onSkuSearchInput(this.value)" />
            </div>

            <div class="sku-results-wrap">
                <table class="sku-results">
                    <thead>
                        <tr>
                            <th style="width:20%;">Artículo</th>
                            <th style="width:60%;">Descripción</th>
                            <th style="width:20%; text-align:right;">Precio</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${skuState.searchText.trim().length > 0
                            ? `<tr class="sku-result-row selected"><td>${skuState.searchText.trim().slice(0,6)}</td><td>1/4 KILO Helado</td><td style="text-align:right;">$ 5.000,00</td></tr>`
                            : `<tr><td colspan="3" style="height:80px; text-align:center; color:#999;">— sin resultados —</td></tr>`}
                    </tbody>
                </table>
            </div>

            <div class="sku-footer-hint">ENTER: seleccionar / TAB: Volver a buscar</div>

            <div class="sku-actions">
                <button class="win-btn"><span class="icon-round">⌨</span>Teclado</button>
                <div class="spacer"></div>
                <button class="win-btn" onclick="skuAssociate()" ${canAssociate ? '' : 'disabled'}><span class="icon-round" style="background:#3a93ff;">◉</span>Asociar</button>
                <button class="win-btn" onclick="skuConfirm()" ${canConfirm ? '' : 'disabled'}><span class="icon-round" style="background:#2f9e44;">◉</span>Confirmar</button>
                <button class="win-btn win-btn-exit" onclick="skuCancel()"><span class="icon-round">⏻</span>Salir</button>
            </div>
        `;
    }

    function onSkuSearchInput(val) {
        skuState.searchText = val;
        const order = orders.find(o => o.id === skuDialogOrderId);
        if (!order) return;
        const focusEnd = () => {
            const inp = document.getElementById('sku-search');
            if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
        };
        renderSkuDialog(order);
        focusEnd();
    }

    function skuAssociate() {
        if (skuState.searchText.trim().length === 0) return;
        skuState.associated = true;
        const order = orders.find(o => o.id === skuDialogOrderId);
        if (order) renderSkuDialog(order);
        showToast('Artículo asociado ✓', 'success');
    }

    // "Asociar artículo indefinido" — atajo: marca la fila como asociada sin buscar.
    function skuAssociateIndef() {
        skuState.searchText = 'INDEF';
        skuState.associated = true;
        const order = orders.find(o => o.id === skuDialogOrderId);
        if (order) renderSkuDialog(order);
        showToast('Artículo marcado como indefinido ✓', 'auto');
    }

    function skuConfirm() {
        const order = orders.find(o => o.id === skuDialogOrderId);
        if (!order) return;
        // Limpia el flag y marca los items como asociados
        order.unknownSku = false;
        order.items.forEach(i => { if (i.undefined) i.undefined = false; });
        closeSkuDialog();
        // Encadena al DialogPay si es efectivo; sino, finaliza directo.
        if (order.paymentMethod === 'Efectivo') {
            openCashDialog(order);
        } else {
            proceedFacturarPedido(order);
        }
    }

    function skuCancel() {
        closeSkuDialog();
    }

    // ══════════════════════════════════════════════════════════════════
    //  DIÁLOGO "VUELTO" (Cobro en efectivo)
    //  Replica el DialogPay del POS on-premise. Se abre si el pedido I+D
    //  viene con paymentMethod = Efectivo.
    //  Reglas del mockup:
    //    - Cancelar Venta → cierra sin facturar.
    //    - Numpad         → carga el "Paga con" (arranca en 0). Calcula vuelto.
    //    - Boleta Manual/Automática/Electrónica → cierra y finaliza la venta.
    //      (Se habilitan cuando Paga con >= Total Venta.)
    // ══════════════════════════════════════════════════════════════════
    let cashDialogOrderId = null;
    let cashState = { pagaCon: '' };

    function openCashDialog(order) {
        cashDialogOrderId = order.id;
        cashState = { pagaCon: '' };
        renderCashDialog(order);
        document.getElementById('cash-overlay').classList.add('show');
    }

    function closeCashDialog() {
        document.getElementById('cash-overlay').classList.remove('show');
        cashDialogOrderId = null;
    }

    function renderCashDialog(order) {
        const dlg = document.getElementById('cash-dialog');
        const importe = order.subtotal;
        const pagaConNum = parseFloat(cashState.pagaCon) || 0;
        const totalVenta = importe;
        const vuelto = Math.max(0, pagaConNum - totalVenta);
        const canPay = pagaConNum >= totalVenta && pagaConNum > 0;
        const pedidoCorto = order.pedidoNro.slice(-3);
        const fmt = n => n.toLocaleString('es-AR');

        dlg.innerHTML = `
            <div class="win-dialog-header">
                <div class="win-title">Vuelto</div>
                <div class="win-dialog-controls">
                    <button>–</button>
                    <button>▢</button>
                    <button class="close" onclick="cashCancel()">✕</button>
                </div>
            </div>

            <div class="cash-topheader">Pedido Nº: ${pedidoCorto}</div>

            <div class="cash-body">
                <div class="cash-form">
                    <label>Forma Pago</label><span class="field select efectivo">EFECTIVO</span>
                    <label>Descuento</label><span class="field select">SIN DESCUENTO</span>
                    <label>Importe</label><span class="field">${fmt(importe)}</span>
                    <label>Descuento</label><span class="field">0</span>
                    <label>Recargo</label><span class="field negative">0.00%</span>
                    <label>Total Venta</label><span class="field">${fmt(totalVenta)}</span>
                    <label>Paga con</label><span class="field">${cashState.pagaCon === '' ? '0' : fmt(pagaConNum)}</span>
                    <label>Vuelto</label><span class="field">${fmt(vuelto)}</span>
                </div>

                <div class="numpad">
                    <button class="numpad-key" onclick="cashNumpad('7')">7</button>
                    <button class="numpad-key" onclick="cashNumpad('8')">8</button>
                    <button class="numpad-key" onclick="cashNumpad('9')">9</button>
                    <button class="numpad-key" onclick="cashNumpad('4')">4</button>
                    <button class="numpad-key" onclick="cashNumpad('5')">5</button>
                    <button class="numpad-key" onclick="cashNumpad('6')">6</button>
                    <button class="numpad-key" onclick="cashNumpad('1')">1</button>
                    <button class="numpad-key" onclick="cashNumpad('2')">2</button>
                    <button class="numpad-key" onclick="cashNumpad('3')">3</button>
                    <button class="numpad-key" onclick="cashNumpad('0')">0</button>
                    <button class="numpad-key" onclick="cashNumpad('.')">.</button>
                    <button class="numpad-key back" onclick="cashNumpad('back')">←</button>
                    <button class="numpad-key check" onclick="cashPay()" ${canPay ? '' : 'disabled'}>✓</button>
                </div>
            </div>

            <div class="cash-actions">
                <button class="cash-boleta-btn" onclick="cashPay()" ${canPay ? '' : 'disabled'}>
                    <span class="icon">📄</span>Boleta<br>Manual
                </button>
                <button class="cash-boleta-btn" onclick="cashPay()" ${canPay ? '' : 'disabled'}>
                    <span class="icon">📄</span>Boleta<br>Automática
                </button>
                <button class="cash-boleta-btn highlight" onclick="cashPay()" ${canPay ? '' : 'disabled'}>
                    <span class="icon">📄</span>Boleta<br>Electrónica
                </button>
                <button class="cash-boleta-btn cancel" onclick="cashCancel()">
                    <span class="icon">✕</span>Cancelar<br>Venta
                </button>
            </div>
        `;
    }

    function cashNumpad(k) {
        if (k === 'back') {
            cashState.pagaCon = cashState.pagaCon.slice(0, -1);
        } else if (k === '.') {
            if (!cashState.pagaCon.includes('.')) cashState.pagaCon += '.';
        } else {
            cashState.pagaCon += k;
        }
        const order = orders.find(o => o.id === cashDialogOrderId);
        if (order) renderCashDialog(order);
    }

    function cashPay() {
        const order = orders.find(o => o.id === cashDialogOrderId);
        if (!order) return;
        const pagaConNum = parseFloat(cashState.pagaCon) || 0;
        if (pagaConNum < order.subtotal) return;
        closeCashDialog();
        proceedFacturarPedido(order);
    }

    function cashCancel() {
        closeCashDialog();
    }

    init();
</script>

</body>
</html>
