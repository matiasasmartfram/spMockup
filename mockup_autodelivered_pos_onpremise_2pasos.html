<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos plataformas (Sucursal: 226)</title>
    <style>
        :root {
            --bg-main: #f0f0e8;
            --bg-panel: #fcfcf4;
            --border-color: #9c9c9c;
            --blue-selected: #0066cc;
            --orange-solic: #ff8000;
            --auto: #6e59ee;
            --auto-soft: #efeaff;
            --auto-border: #d6ccff;
        }

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            font-size: 12px;
        }

        body {
            background-color: #7da2ce;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Contenedor Principal (Ventana) */
        .window {
            background-color: var(--bg-main);
            border: 3px solid #6b9cde;
            border-radius: 4px;
            width: 1000px;
            max-width: 100%;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }

        /* Barra de título estilo Windows */
        .window-header {
            background: linear-gradient(to bottom, #0058e6, #3a93ff);
            color: white;
            padding: 5px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }

        .window-controls button {
            background: #e04343;
            color: white;
            border: 1px solid #fff;
            padding: 1px 6px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Cuerpo de la aplicación */
        .app-container {
            display: grid;
            grid-template-columns: 60% 40%;
            gap: 8px;
            padding: 8px;
        }

        /* Pestañas Superiores Left */
        .tabs {
            display: flex;
            background-color: var(--bg-main);
            border-bottom: 1px solid var(--border-color);
        }

        .tab {
            padding: 6px 30px;
            border: 1px solid var(--border-color);
            border-bottom: none;
            background-color: var(--bg-panel);
            cursor: pointer;
            text-align: center;
        }

        .tab.active {
            background-color: var(--bg-panel);
            font-weight: bold;
            position: relative;
            bottom: -1px;
            z-index: 2;
        }

        .tab.inactive {
            background-color: #e4e4dc;
            color: #666;
        }

        /* TABLA DE PEDIDOS */
        .left-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .table-container {
            background-color: white;
            border: 1px solid var(--border-color);
            height: 350px;
            overflow-y: scroll;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: var(--bg-main);
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 4px;
            font-weight: normal;
        }

        td {
            padding: 6px 4px;
            border-right: 1px solid #e0e0e0;
            border-bottom: 1px solid #e0e0e0;
            vertical-align: middle;
        }

        tbody tr { cursor: pointer; }
        tbody tr:hover { background-color: #f7f9fc; }

        .row-selected {
            outline: 2px solid var(--blue-selected);
            background-color: #f2f7ff;
        }

        /* Estados internos de la tabla */
        .badge-grido {
            color: #d3141e;
            font-weight: bold;
            font-style: italic;
            font-size: 14px;
        }
        .badge-grido span { color: #004b93; }

        /* Badge violeta para plataforma I+D (SmartPedidos · auto-entrega) */
        .badge-id {
            display: inline-block;
            color: var(--auto);
            font-weight: bold;
            font-style: italic;
            font-size: 14px;
            letter-spacing: .5px;
        }
        .badge-id::after {
            content: 'AUTO';
            display: inline-block;
            background: var(--auto-soft);
            color: var(--auto);
            font-style: normal;
            font-size: 9px;
            font-weight: bold;
            padding: 1px 4px;
            border-radius: 8px;
            margin-left: 4px;
            vertical-align: middle;
            letter-spacing: .3px;
        }

        /* fila I+D con un sutil tinte violeta para diferenciarlas a primera vista */
        tr.row-auto td:first-child {
            border-left: 3px solid var(--auto);
        }
        tr.row-auto.row-selected {
            outline: 2px solid var(--auto);
            background-color: #f5f2ff;
        }

        .status-solic {
            background-color: var(--orange-solic);
            color: white;
            text-align: center;
            font-weight: bold;
            padding: 2px;
            border-radius: 2px;
            display: block;
        }

        .status-facturado {
            background-color: #2f9e44;
            color: white;
            text-align: center;
            font-weight: bold;
            padding: 2px;
            border-radius: 2px;
            display: block;
        }

        .status-rechazado {
            background-color: #c0392b;
            color: white;
            text-align: center;
            font-weight: bold;
            padding: 2px;
            border-radius: 2px;
            display: block;
        }

        /* Resumen de Estados (Botones de abajo a la izquierda) */
        .status-summary {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            margin-top: 8px;
        }

        .btn-status {
            border: 1px solid var(--border-color);
            padding: 6px;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
        }
        .solicitado { background-color: #ff8000; color: white; }
        .preparacion { background-color: #dcd82c; color: black; }
        .listo { background-color: #00cc66; color: white; }
        .camino { background-color: #3399ff; color: white; }
        .observada { background-color: #808080; color: white; }

        /* Logos Plataformas Inferiores */
        .platform-logos {
            display: flex;
            gap: 5px;
            margin-top: 8px;
            align-items: center;
        }
        .logo-placeholder {
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            background: white;
            font-weight: bold;
            font-size: 10px;
            border-radius: 4px;
            text-align: center;
            min-width: 45px;
        }

        /* PANEL DERECHO (DETALLE DEL PEDIDO) */
        .right-panel {
            border: 1px solid var(--border-color);
            background-color: var(--bg-panel);
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .right-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
            margin-bottom: 5px;
        }

        .update-box {
            background-color: white;
            border: 1px solid var(--border-color);
            padding: 2px 10px;
            text-align: center;
        }
        .update-box strong { font-size: 14px; }

        /* Aviso de pedido I+D (auto-entrega) en el panel derecho */
        .auto-banner {
            background: var(--auto-soft);
            border: 1px solid var(--auto-border);
            color: #5040d0;
            padding: 6px 8px;
            margin-bottom: 6px;
            border-radius: 3px;
            font-size: 11px;
            line-height: 1.35;
        }
        .auto-banner b { color: var(--auto); }

        /* Contenido del Ticket o Comanda */
        .ticket-detail {
            background-color: white;
            border: 1px solid var(--border-color);
            padding: 8px;
            height: 320px;
            overflow-y: auto;
            font-family: monospace;
            white-space: pre-wrap;
            line-height: 1.4;
        }

        .ticket-empty {
            color: #999;
            font-family: Arial, sans-serif;
            font-style: italic;
            text-align: center;
            padding-top: 130px;
        }

        /* Acciones del lado derecho */
        .right-actions {
            margin-top: 8px;
        }
        .action-row-1 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 5px;
            margin-bottom: 5px;
        }
        .action-row-1.auto {
            grid-template-columns: 1fr 1fr;
        }
        .action-row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }

        .btn-action {
            padding: 8px;
            border: 1px solid var(--border-color);
            background-color: #e0e0d8;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
            border-radius: 3px;
        }
        .btn-action:active { background-color: #ccc; }
        .btn-action:disabled {
            opacity: .55;
            cursor: not-allowed;
        }
        .btn-danger {
            border: 2px solid var(--blue-selected);
            color: #cc0000;
            background-color: #f0f0f0;
        }

        /* Botón FACTURAR (verde, solo para pedidos I+D) */
        .btn-facturar {
            border: 2px solid #1f7a32;
            color: #fff;
            background-color: #2f9e44;
        }
        .btn-facturar:hover { background-color: #28893b; }

        /* Botón RECHAZAR I+D (rojo destacado) */
        .btn-rechazar-auto {
            border: 2px solid #8a1f1f;
            color: #fff;
            background-color: #c0392b;
        }
        .btn-rechazar-auto:hover { background-color: #a8311f; }

        .circle-icon {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #999;
            vertical-align: middle;
            margin-right: 3px;
        }

        /* Toast simple para feedback */
        .toast {
            position: fixed;
            bottom: 18px;
            right: 18px;
            background: #333;
            color: #fff;
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.3);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity .2s, transform .2s;
            z-index: 999;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.success { background: #2f9e44; }
        .toast.danger { background: #c0392b; }
        .toast.auto { background: var(--auto); }
    </style>
</head>
<body>

<div class="window">
    <div class="window-header">
        <span>Pedidos plataformas (Sucursal: 226)</span>
        <div class="window-controls">
            <button>X</button>
        </div>
    </div>

    <div class="app-container">

        <div class="left-panel">
            <div>
                <div class="tabs">
                    <div class="tab active">Pedidos</div>
                    <div class="tab inactive">Historial</div>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 18%;">Servicio</th>
                                <th style="width: 12%;">Estado</th>
                                <th style="width: 27%;">Cliente</th>
                                <th style="width: 25%;"># Pedido</th>
                                <th style="width: 10%;">H. Entrega</th>
                                <th style="width: 8%;">Tiempo</th>
                            </tr>
                        </thead>
                        <tbody id="orders-tbody">
                            <!-- filas renderizadas por JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <div>
                <div class="status-summary">
                    <div class="btn-status solicitado"><span id="cnt-solic">0</span><br>Solicitado</div>
                    <div class="btn-status preparacion">0<br>En Preparacion</div>
                    <div class="btn-status listo">0<br>Listo</div>
                    <div class="btn-status camino">0<br>En camino</div>
                    <div class="btn-status observada">0<br>Observada</div>
                </div>

                <div class="platform-logos">
                    <button class="logo-placeholder">🚲</button>
                    <button class="logo-placeholder" style="color:red">F</button>
                    <button class="logo-placeholder" style="color:orange">Ped</button>
                    <button class="logo-placeholder" style="color:coral">Rappi</button>
                    <button class="logo-placeholder" style="color:blue">grido</button>
                    <button class="logo-placeholder" style="color:green">Uber</button>
                    <button class="logo-placeholder" style="color:var(--auto)">I+D</button>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <div>
                <div class="right-header">
                    <div class="update-box">
                        <small>Última actualización:</small><br>
                        <strong>10:49:08</strong>
                    </div>
                    <div>
                        <button style="padding:5px;">🔄</button>
                        <button style="padding:5px;">⏻</button>
                    </div>
                </div>

                <div id="auto-banner-container"></div>

                <div class="ticket-detail" id="ticket-detail">
                    <div class="ticket-empty">Seleccioná un pedido de la lista para ver su detalle.</div>
                </div>
            </div>

            <div class="right-actions" id="right-actions">
                <!-- botones renderizados por JS -->
            </div>
        </div>

    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    /* ════════════════════════════════════════════════════════════════════════════════
       MOCKUP POS ON-PREMISE — Funcionalidad AUTODELIVERED (I+D / SmartPedidos)
       ────────────────────────────────────────────────────────────────────────────────
       Adapta el POS on-premise para que conviva el flujo NORMAL (Grido, etc.) con la
       nueva modalidad AUTODELIVERED de I+D. Mismo principio que el mockup cloud:

       • Pedidos NORMALES (autoDelivered:false): botones "Confirmar / Confirmar entrega
         / Rechazar" (igual que hoy).
       • Pedidos I+D (autoDelivered:true): botones "FACTURAR / RECHAZAR" (1 paso).
         FACTURAR equivale al "Confirmar" pero finaliza inmediatamente; RECHAZAR cierra
         el pedido. Ambos llevan el pedido a un estado final.

       Las filas I+D se distinguen con:
         · borde violeta a la izquierda de la fila
         · badge "I+D" + chip "AUTO" violeta en la columna Servicio
         · banner explicativo arriba del ticket cuando se selecciona

       Al click en una fila, el ticket-detail se actualiza con los datos del pedido
       (manteniendo el formato monoespaciado tipo comanda) y se re-renderizan los
       botones de acción correspondientes.
       ════════════════════════════════════════════════════════════════════════════════ */

    // ── DATA ──
    const orders = [
        {
            id: 'ord1',
            servicio: 'grido',
            platformId: 'GR',
            pedidoNro: '47868800008',
            cliente: 'Marcelo',
            clienteId: '32145678',
            telefono: '3514567890',
            direccion: 'Av. Rafael Núñez 4200 - Córdoba',
            fecha: '24-06-2026 10:38',
            repartidor: 'Sin asignar',
            tipoEntrega: 'Delivery de PediGrido',
            nota: 'Sin aclaración |',
            items: [
                { qty: '1 KILO', name: '', detalle: 'Op: Dulce de Leche Granizado Frutilla a la Crema Chocolate Suizo', precio: 14000 }
            ],
            subtotal: 14000,
            autoDelivered: false,
            estado: 'SOLIC',
            estadoFinal: null
        },
        {
            id: 'ord2',
            servicio: 'grido',
            platformId: 'GR',
            pedidoNro: '50889831',
            cliente: 'Lujan',
            clienteId: '45155725',
            telefono: '3518568730',
            direccion: 'Misiones 895 - Villa Allende',
            fecha: '24-06-2026 10:44',
            repartidor: 'Sin asignar',
            tipoEntrega: 'Delivery de PediGrido',
            nota: 'Sin aclaración |',
            items: [
                { qty: '1 KILO', name: '', detalle: 'Op: Frutilla al Agua Marroc Grido Menta Granizada Choco Blanco Oreo|| SUSTITUTO: Frutilla a la crema', precio: 14000 },
                { qty: '1', name: 'Cucurucho doble', detalle: '', precio: 1500 }
            ],
            subtotal: 15500,
            autoDelivered: false,
            estado: 'SOLIC',
            estadoFinal: null
        },
        {
            id: 'ord3',
            servicio: 'I+D',
            platformId: 'ID',
            pedidoNro: '1200045871',
            cliente: 'Jorge Pérez',
            clienteId: '28998765',
            telefono: '3514455667',
            direccion: 'Bv. San Juan 567 - Córdoba',
            fecha: '24-06-2026 10:50',
            repartidor: 'Auto-asignado (Plataforma)',
            tipoEntrega: 'Delivery de SmartPedidos (I+D)',
            nota: 'Pago online: MercadoPago | Entregar en planta baja',
            items: [
                { qty: '1 KILO', name: '', detalle: 'Op: Chocolate Amargo Crema Americana Dulce de Leche', precio: 10000 },
                { qty: '2', name: 'Cucuruchos', detalle: '', precio: 1600 }
            ],
            subtotal: 11600,
            autoDelivered: true,
            estado: 'SOLIC',
            estadoFinal: null
        },
        {
            id: 'ord4',
            servicio: 'I+D',
            platformId: 'ID',
            pedidoNro: '1200045902',
            cliente: 'Sofía Romero',
            clienteId: '38112233',
            telefono: '3517788990',
            direccion: 'Av. Vélez Sarsfield 33 - Córdoba',
            fecha: '24-06-2026 10:53',
            repartidor: 'Auto-asignado (Plataforma)',
            tipoEntrega: 'Delivery de SmartPedidos (I+D)',
            nota: 'Pago online: MercadoPago | Sin timbre, llamar al llegar',
            items: [
                { qty: '1', name: 'Postre Familiar', detalle: 'Op: Tres leches con frutos rojos', precio: 9500 }
            ],
            subtotal: 9500,
            autoDelivered: true,
            estado: 'SOLIC',
            estadoFinal: null
        }
    ];

    let selectedOrderId = null;

    // ── INIT ──
    function init() {
        renderRows();
        updateCounts();
    }

    function renderRows() {
        const tbody = document.getElementById('orders-tbody');
        tbody.innerHTML = orders.map(o => {
            const rowClass = (o.autoDelivered ? 'row-auto' : '')
                + (selectedOrderId === o.id ? ' row-selected' : '');
            const servicioHtml = o.autoDelivered
                ? `<span class="badge-id">I+D</span>`
                : `<span class="badge-grido">gri<span>do</span></span>`;
            let estadoHtml;
            if (o.estadoFinal === 'FACTURADO') estadoHtml = `<span class="status-facturado">FACT</span>`;
            else if (o.estadoFinal === 'RECHAZADO') estadoHtml = `<span class="status-rechazado">RECH</span>`;
            else estadoHtml = `<span class="status-solic">SOLIC</span>`;
            return `
                <tr class="${rowClass}" onclick="selectOrder('${o.id}')">
                    <td>${servicioHtml}</td>
                    <td>${estadoHtml}</td>
                    <td>${o.cliente}</td>
                    <td>${o.pedidoNro}</td>
                    <td></td>
                    <td style="text-align: center;">:</td>
                </tr>
            `;
        }).join('');
    }

    function updateCounts() {
        const solic = orders.filter(o => !o.estadoFinal).length;
        document.getElementById('cnt-solic').textContent = solic;
    }

    function selectOrder(id) {
        if (selectedOrderId === id) {
            // toggle off
            selectedOrderId = null;
            renderRows();
            showEmptyTicket();
            renderActions(null);
            return;
        }
        selectedOrderId = id;
        renderRows();
        const order = orders.find(o => o.id === id);
        renderTicket(order);
        renderActions(order);
    }

    function showEmptyTicket() {
        document.getElementById('auto-banner-container').innerHTML = '';
        document.getElementById('ticket-detail').innerHTML =
            `<div class="ticket-empty">Seleccioná un pedido de la lista para ver su detalle.</div>`;
    }

    // Formato tipo comanda (monoespaciado) — alineación a 42 columnas (igual al original)
    function pad(label, value, width = 42) {
        const s = label + value;
        if (s.length >= width) return s;
        return label + ' '.repeat(width - s.length) + value;
    }

    function renderTicket(order) {
        // Items
        const itemsHtml = order.items.map(i => {
            const qtyAndName = (i.qty + (i.name ? ' ' + i.name : '')).trim();
            const linea = pad(qtyAndName, '$' + i.precio.toLocaleString('es-AR'));
            const detalle = i.detalle ? `\n  ${i.detalle}` : '';
            return linea + detalle;
        }).join('\n\n');

        const plataforma = order.autoDelivered ? 'SmartPedidos (I+D)' : 'PediGrido';

        const ticket =
`PLATAFORMA                    ${plataforma}
NOMBRE REPARTIDOR              ${order.repartidor}
FECHA                     ${order.fecha}
ENTREGA
TIPO ENTREGA             ${order.tipoEntrega}
IDENTIFICADOR PEDIDO PLATAFORMA
  ${order.pedidoNro}
CLIENTE
  ${order.cliente}
IDENTIFICACION DE CLIENTE
  ${order.clienteId}
TELEFONO
  ${order.telefono}
DIRECCION
  ${order.direccion}
NOTA DEL PEDIDO
  ${order.nota}
------------------------------------------
ITEM                                PRECIO

${itemsHtml}
------------------------------------------
${pad('Sub-Total:', '$' + order.subtotal.toLocaleString('es-AR'))}`;

        document.getElementById('ticket-detail').textContent = ticket;
    }

    function renderActions(order) {
        const cont = document.getElementById('right-actions');
        if (!order) {
            cont.innerHTML = `
                <div class="action-row-1">
                    <button class="btn-action" disabled><span class="circle-icon"></span>Confirmar</button>
                    <button class="btn-action" disabled><span class="circle-icon"></span>Confirmar entrega</button>
                    <button class="btn-action btn-danger" disabled>❌ Rechazar</button>
                </div>
                <div class="action-row-2">
                    <button class="btn-action" disabled><span class="circle-icon"></span>Asociar artículo</button>
                    <button class="btn-action" disabled>🖨️ Reimprimir comanda</button>
                </div>
            `;
            return;
        }

        // Pedido ya resuelto (facturado o rechazado): bloquear acciones
        if (order.estadoFinal) {
            const label = order.estadoFinal === 'FACTURADO'
                ? '✅ Pedido facturado — finalizado'
                : '❌ Pedido rechazado — finalizado';
            const color = order.estadoFinal === 'FACTURADO' ? '#2f9e44' : '#c0392b';
            cont.innerHTML = `
                <div style="padding:10px; text-align:center; font-weight:bold; color:${color}; border:1px solid ${color}; background:#fff; border-radius:3px; margin-bottom:5px;">
                    ${label}
                </div>
                <div class="action-row-2">
                    <button class="btn-action" disabled><span class="circle-icon"></span>Asociar artículo</button>
                    <button class="btn-action">🖨️ Reimprimir comanda</button>
                </div>
            `;
            return;
        }

        // Pedido I+D (auto-entrega): mismo formato que el flujo normal, solo cambia "Confirmar" por "Facturar"
        if (order.autoDelivered) {
            cont.innerHTML = `
                <div class="action-row-1">
                    <button class="btn-action" onclick="facturarPedido('${order.id}')"><span class="circle-icon"></span>Facturar</button>
                    <button class="btn-action" style="color:#888;" disabled><span class="circle-icon"></span>Confirmar entrega</button>
                    <button class="btn-action btn-danger" onclick="rechazarPedido('${order.id}')">❌ Rechazar</button>
                </div>
                <div class="action-row-2">
                    <button class="btn-action" style="color:#888;" disabled><span class="circle-icon"></span>Asociar artículo</button>
                    <button class="btn-action">🖨️ Reimprimir comanda</button>
                </div>
            `;
            return;
        }

        // Pedido normal (Grido): flujo de 3 pasos
        //   1) initial   → Confirmar / Confirmar entrega (off) / Rechazar  |  Asociar artículo (off) / Reimprimir
        //   2) confirmed → Listo para Entrega / Confirmar entrega (off) / Rechazar  |  Asociar artículo (off) / Reimprimir
        //   3) ready     → Enviar (off) / Confirmar entrega (off) / Rechazar  |  ⭐ Realizar venta / Reimprimir
        const step = order.flowStep || 'initial';

        let primaryBtn;
        if (step === 'initial') {
            primaryBtn = `<button class="btn-action" onclick="confirmarPedido('${order.id}')"><span class="circle-icon"></span>Confirmar</button>`;
        } else if (step === 'confirmed') {
            primaryBtn = `<button class="btn-action" onclick="listoParaEntrega('${order.id}')"><span class="circle-icon"></span>Listo para Entrega</button>`;
        } else { // 'ready'
            primaryBtn = `<button class="btn-action" style="color:#888;" disabled><span class="circle-icon"></span>Enviar</button>`;
        }

        const secondaryBtn = (step === 'ready')
            ? `<button class="btn-action" onclick="realizarVenta('${order.id}')">⭐ Realizar venta</button>`
            : `<button class="btn-action" style="color:#888;" disabled><span class="circle-icon"></span>Asociar artículo</button>`;

        cont.innerHTML = `
            <div class="action-row-1">
                ${primaryBtn}
                <button class="btn-action" style="color:#888;" disabled><span class="circle-icon"></span>Confirmar entrega</button>
                <button class="btn-action btn-danger" onclick="rechazarPedido('${order.id}')">❌ Rechazar</button>
            </div>
            <div class="action-row-2">
                ${secondaryBtn}
                <button class="btn-action">🖨️ Reimprimir comanda</button>
            </div>
        `;
    }

    // ── ACCIONES ──
    function facturarPedido(id) {
        const o = orders.find(x => x.id === id);
        if (!o || o.estadoFinal) return;
        o.estadoFinal = 'FACTURADO';
        renderRows();
        renderActions(o);
        updateCounts();
        showToast(o.autoDelivered ? 'Pedido I+D facturado → finalizado' : 'Pedido facturado', o.autoDelivered ? 'auto' : 'success');
    }

    function confirmarPedido(id) {
        const o = orders.find(x => x.id === id);
        if (!o || o.estadoFinal) return;
        o.flowStep = 'confirmed';
        renderActions(o);
        showToast('Pedido confirmado', 'success');
    }

    function listoParaEntrega(id) {
        const o = orders.find(x => x.id === id);
        if (!o || o.estadoFinal) return;
        o.flowStep = 'ready';
        renderActions(o);
        showToast('Pedido listo para entrega', 'success');
    }

    function realizarVenta(id) {
        const o = orders.find(x => x.id === id);
        if (!o || o.estadoFinal) return;
        o.estadoFinal = 'FACTURADO';
        renderRows();
        renderActions(o);
        updateCounts();
        showToast('Venta realizada — pedido finalizado', 'success');
    }

    function rechazarPedido(id) {
        const o = orders.find(x => x.id === id);
        if (!o || o.estadoFinal) return;
        o.estadoFinal = 'RECHAZADO';
        renderRows();
        renderActions(o);
        updateCounts();
        showToast(o.autoDelivered ? 'Pedido I+D rechazado → finalizado' : 'Pedido rechazado', 'danger');
    }

    function showToast(msg, type = '') {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'toast show' + (type ? ' ' + type : '');
        clearTimeout(t._timer);
        t._timer = setTimeout(() => { t.className = 'toast'; }, 2500);
    }

    init();
</script>

</body>
</html>
