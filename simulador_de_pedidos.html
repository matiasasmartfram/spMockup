<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Pedido – Smartfran Demo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Source+Code+Pro:wght@400&display=swap');

        :root {
            --primary-color: #007bff;
            --primary-hover-color: #0056b3;
            --background-color: #f4f6f8;
            --container-bg-color: #ffffff;
            --text-color: #333;
            --border-color: #d1d9e2;
            --code-bg-color: #2d3436;
            --code-text-color: #dfe6e9;
        }

        body {
            font-family: 'Lato', sans-serif;
            margin: 2rem;
            background-color: var(--background-color);
            color: var(--text-color);
        }

        .container {
            max-width: 520px;
            margin: auto;
            padding: 2rem 2.5rem;
            background-color: var(--container-bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 700;
            color: #555;
        }

        input,
        select {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: white;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.2);
        }

        button {
            width: 100%;
            margin-top: 1.5rem;
            padding: 0.8rem 1rem;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background-color: var(--primary-color);
            color: #fff;
            transition: background-color 0.2s;
        }

        button:hover:not(:disabled) {
            background-color: var(--primary-hover-color);
        }

        button:disabled {
            background-color: #9dbfe8;
            cursor: not-allowed;
        }

        .response-container {
            margin-top: 2rem;
        }

        .response-container h3 {
            font-size: 1.1em;
            color: #34495e;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }

        pre {
            white-space: pre-wrap;
            background-color: var(--code-bg-color);
            color: var(--code-text-color);
            padding: 1rem;
            border-radius: 6px;
            margin-top: 1rem;
            overflow: auto;
            font-family: 'Source Code Pro', monospace;
        }

        /* --- Bloque de Opciones Avanzadas --- */
        details.advanced {
            margin-bottom: 1.25rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: #fafbfc;
        }

        details.advanced>summary {
            padding: 0.75rem;
            font-weight: 700;
            color: #555;
            cursor: pointer;
            user-select: none;
        }

        details.advanced[open]>summary {
            border-bottom: 1px solid var(--border-color);
        }

        .advanced-body {
            padding: 1rem 0.75rem;
        }

        .advanced-hint {
            font-size: 0.85rem;
            color: #7a8794;
            margin: 0 0 1rem;
        }

        .item-card {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.75rem;
            margin-bottom: 0.75rem;
            background-color: var(--container-bg-color);
        }

        .item-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 40px;
            gap: 0.5rem;
            align-items: end;
        }

        .item-full,
        .item-notes {
            grid-column: 1 / -1;
        }

        .item-row label {
            font-size: 0.75rem;
            font-weight: 400;
            margin-bottom: 0.25rem;
        }

        .item-row input,
        .item-row select {
            padding: 0.5rem;
            font-size: 0.9rem;
        }

        .btn-small {
            width: auto;
            margin-top: 0;
            padding: 0.5rem 0.9rem;
            font-size: 0.9rem;
        }

        .btn-remove {
            width: 100%;
            margin-top: 0;
            padding: 0.5rem 0;
            font-size: 1.1rem;
            line-height: 1;
            background-color: #e74c3c;
        }

        .btn-remove:hover:not(:disabled) {
            background-color: #c0392b;
        }

        .btn-remove:disabled {
            background-color: #e8b5af;
        }

        .total-line {
            margin-top: 1rem;
            padding-top: 0.75rem;
            border-top: 1px solid var(--border-color);
            font-weight: 700;
            color: #2c3e50;
        }

        .total-line small {
            display: block;
            font-weight: 400;
            color: #7a8794;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>

    <div class="container">
        <form id="pedidoForm">
            <h2>Crear Pedido</h2>

            <div class="form-group">
                <label for="branch">Branch ID</label>
                <input type="number" id="branch" value="" required>
            </div>

            <div class="form-group">
                <label for="name">Nombre</label>
                <input type="text" id="name" value="" required>
            </div>

            <div class="form-group">
                <label for="lastName">Apellido</label>
                <input type="text" id="lastName" value="" required>
            </div>

            <div class="form-group">
                <label for="tenant">Tenant</label>
                <select id="tenant" required>
                    <option value="grido">Grido</option>
                    <option value="weiss">Weiss</option>
                </select>
            </div>

            <div class="form-group">
                <label for="platform">Plataforma</label>
                <select id="platform" required>
                    <option value="pedigrido">Pedigrido</option>
                    <option value="pedidosya">PedidosYa</option>
                </select>
            </div>

            <div class="form-group">
                <label for="environment">Ambiente</label>
                <select id="environment" required>
                    <option value="S">S</option>
                    <option value="P">P</option>
                </select>
            </div>

            <div id="advancedWrapper" hidden>
                <details id="advancedPedigrido" class="advanced">
                    <summary>⚙️ Opciones avanzadas (Pedigrido)</summary>
                    <div class="advanced-body">
                        <p class="advanced-hint">
                            Todo viene precargado con la orden por defecto. Si dejás este bloque
                            cerrado se envía esa orden tal cual; si lo dejás abierto, se envía lo
                            que configures acá.
                        </p>

                        <div class="form-group">
                            <label for="deliveryMode">Tipo de entrega</label>
                            <select id="deliveryMode">
                                <option value="platformDelivery">Delivery a Cargo de la Plataforma</option>
                                <option value="ownDelivery">Delivery Propio</option>
                                <option value="customerPickup">Retira Cliente</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="paymentMode">Pago</label>
                            <select id="paymentMode">
                                <option value="cash">Efectivo</option>
                                <option value="online">Online</option>
                            </select>
                        </div>

                        <label>Productos</label>
                        <div id="itemsContainer"></div>
                        <button type="button" id="addItemButton" class="btn-small">+ Agregar producto</button>

                        <div class="total-line">
                            Total: <span id="itemsTotal">$0</span>
                            <small>Se envía en payment.partial y payment.subtotal</small>
                        </div>
                    </div>
                </details>
            </div>

            <button type="submit" id="submitButton">Crear Pedido</button>
        </form>

        <div id="responseContainer" class="response-container" hidden>
            <h3>Respuesta del Servidor</h3>
            <pre id="respuesta"></pre>
        </div>
    </div>

    <script>
        // Para producción:
         const WORKER_URL = 'https://smartfran.matiasa.workers.dev/';
        // Para pruebas locales (Wrangler):
        //const WORKER_URL = 'http://localhost:8787/';

        // --- Lógica de Dependencia Tenant/Plataforma (Bloqueo Visual) ---
        const tenantSelect = document.getElementById('tenant');
        const platformSelect = document.getElementById('platform');
        const pedigridoOption = platformSelect.querySelector('option[value="pedigrido"]');

        const advancedWrapper = document.getElementById('advancedWrapper');
        const advancedDetails = document.getElementById('advancedPedigrido');

        const updatePlatformOptions = () => {
            if (tenantSelect.value === 'weiss') {
                // Si es Weiss, ocultamos y deshabilitamos Pedigrido
                pedigridoOption.hidden = true;
                pedigridoOption.disabled = true;
                if (platformSelect.value === 'pedigrido') {
                    platformSelect.value = 'pedidosya';
                }
            } else {
                // Si es Grido, mostramos y habilitamos todo
                pedigridoOption.hidden = false;
                pedigridoOption.disabled = false;
            }

            // El bloque avanzado por ahora es propio de Pedigrido: cada plataforma
            // tiene su propia estructura de orden y necesita su propio avanzado.
            const isPedigrido = platformSelect.value === 'pedigrido';
            advancedWrapper.hidden = !isPedigrido;

            // Cerrarlo además de ocultarlo. Si queda abierto e invisible, al volver
            // a Pedigrido se aplicaría sin que el usuario lo esté viendo.
            if (!isPedigrido) advancedDetails.open = false;
        };

        // --- Catálogo de productos (solo precarga: el worker acepta cualquier SKU) ---
        const PEDIGRIDO_CATALOG = {
            '64': { name: 'Helado 1 Kg', unitPrice: 9500, notes: 'Super dulce de leche Grido Tramontana Chocolate c/Almendras' },
            '65': { name: 'Helado 1/2 Kg', unitPrice: 9000, notes: 'Super dulce de leche Grido Tramontana Chocolate c/Almendras' },
            '66': { name: 'Helado 1/4 Kg', unitPrice: 9500, notes: 'Super dulce de leche Grido Tramontana Chocolate c/Almendras' }
        };

        const DEFAULT_SKU = '64';
        const itemsContainer = document.getElementById('itemsContainer');

        const buildItemCard = (sku) => {
            const preset = PEDIGRIDO_CATALOG[sku];
            const options = Object.entries(PEDIGRIDO_CATALOG)
                .map(([code, p]) => `<option value="${code}">${p.name}</option>`)
                .join('');

            const card = document.createElement('div');
            card.className = 'item-card';
            card.innerHTML = `
                <div class="item-row">
                    <div class="item-full">
                        <label>Producto</label>
                        <select class="item-product">${options}</select>
                    </div>
                    <div>
                        <label>SKU</label>
                        <input type="text" class="item-sku" value="${sku}">
                    </div>
                    <div>
                        <label>Precio unitario</label>
                        <input type="number" class="item-price" min="0" step="1" value="${preset.unitPrice}">
                    </div>
                    <div>
                        <label>Cantidad</label>
                        <input type="number" class="item-qty" min="1" step="1" value="1">
                    </div>
                    <button type="button" class="btn-remove" title="Quitar producto">&times;</button>
                    <div class="item-notes">
                        <label>Notas</label>
                        <input type="text" class="item-notes-input" value="${preset.notes}">
                    </div>
                </div>`;

            card.querySelector('.item-product').value = sku;
            return card;
        };

        // El 'name' no es editable: sale siempre del producto elegido en el select.
        const readItems = () => Array.from(itemsContainer.querySelectorAll('.item-card')).map(card => ({
            name: PEDIGRIDO_CATALOG[card.querySelector('.item-product').value].name,
            sku: card.querySelector('.item-sku').value.trim(),
            unitPrice: Number(card.querySelector('.item-price').value),
            quantity: Number(card.querySelector('.item-qty').value),
            notes: card.querySelector('.item-notes-input').value
        }));

        const renderTotal = () => {
            const total = readItems().reduce((acc, it) => acc + (it.unitPrice * it.quantity), 0);
            document.getElementById('itemsTotal').textContent = '$' + total.toLocaleString('es-AR');
        };

        // No se puede quedar sin productos: con una sola fila, el botón se deshabilita.
        const refreshRemoveButtons = () => {
            const cards = itemsContainer.querySelectorAll('.item-card');
            cards.forEach(card => { card.querySelector('.btn-remove').disabled = cards.length === 1; });
        };

        const addItem = (sku = DEFAULT_SKU) => {
            itemsContainer.appendChild(buildItemCard(sku));
            refreshRemoveButtons();
            renderTotal();
        };

        itemsContainer.addEventListener('input', renderTotal);

        itemsContainer.addEventListener('change', e => {
            // Elegir otro producto repuebla SKU, precio y notas de esa fila.
            // Después de la precarga los tres siguen siendo editables.
            if (!e.target.classList.contains('item-product')) return;

            const card = e.target.closest('.item-card');
            const preset = PEDIGRIDO_CATALOG[e.target.value];
            card.querySelector('.item-sku').value = e.target.value;
            card.querySelector('.item-price').value = preset.unitPrice;
            card.querySelector('.item-notes-input').value = preset.notes;
            renderTotal();
        });

        itemsContainer.addEventListener('click', e => {
            if (!e.target.classList.contains('btn-remove')) return;
            e.target.closest('.item-card').remove();
            refreshRemoveButtons();
            renderTotal();
        });

        document.getElementById('addItemButton').addEventListener('click', () => addItem());

        // Ejecutar al cambiar y al cargar la página
        tenantSelect.addEventListener('change', updatePlatformOptions);
        platformSelect.addEventListener('change', updatePlatformOptions);
        window.addEventListener('DOMContentLoaded', () => {
            addItem();
            updatePlatformOptions();
        });

        document.getElementById('pedidoForm').addEventListener('submit', async e => {
            e.preventDefault();

            const branch = document.getElementById('branch').value.trim();
            const name = document.getElementById('name').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const tenant = tenantSelect.value;
            const platform = platformSelect.value;
            const environment = document.getElementById('environment').value;

            const responseContainer = document.getElementById('responseContainer');
            const out = document.getElementById('respuesta');
            const button = document.getElementById('submitButton');

            // --- UX Mejorada: Feedback al usuario ---
            button.disabled = true;
            button.textContent = 'Enviando...';
            responseContainer.hidden = false;
            out.textContent = 'Procesando la solicitud...';

            // Construcción del nuevo payload
            const payload = {
                context: {
                    tenant: tenant,
                    platform: platform,
                    environment: environment
                },
                auth: {
                    user: {
                        name: name,
                        lastName: lastName
                    }
                },
                data: {
                    branchId: Number(branch),
                    scenario: "default"
                }
            };

            // Solo si el usuario desplegó el avanzado. Cerrado = orden por defecto.
            if (!advancedWrapper.hidden && advancedDetails.open) {
                payload.data.advanced = {
                    deliveryMode: document.getElementById('deliveryMode').value,
                    paymentMode: document.getElementById('paymentMode').value,
                    items: readItems()
                };
            }

            try {
                const res = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const text = await res.text();
                let pretty;
                try {
                    // Intenta formatear la respuesta como JSON
                    pretty = JSON.stringify(JSON.parse(text), null, 2);
                } catch {
                    // Si no es JSON, muestra el texto plano
                    pretty = text;
                }

                out.textContent = `Status: ${res.status} ${res.statusText}\n\n${pretty}`;

            } catch (err) {
                out.textContent = 'Error de red: ' + err.message;
            } finally {
                // --- UX Mejorada: Restaurar el botón ---
                button.disabled = false;
                button.textContent = 'Crear Pedido';
            }
        });
    </script>

</body>

</html>
